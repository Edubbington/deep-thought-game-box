<x-dc>

body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}

</style>

<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Add a character</div>
<div style="width: 10px"></div>
</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="flex: 1; display: flex; gap: 20px; align-items: center">
<div style="width: 220px; height: 220px; flex-shrink: 0; border: 2px dashed #A9B8CA; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #A9B8CA">[QR CODE]</div>
<div style="display: flex; flex-direction: column; gap: 10px">

</div>
</div>

<span style="font-size: 22px; color: #A9B8CA">New sheets appear here to be checked.</span>
<button type="button" style="width: 150px; height: 64px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Back</button>
</div>
</div>
</div>
