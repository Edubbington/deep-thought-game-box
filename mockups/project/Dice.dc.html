<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dice roller</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">Dice</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">6 dice</div>
<div style="width: 10px"></div>
</div><div style="flex: 1; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; justify-content: center"><div style="width: 84px; height: 84px; border-radius: 16px; background: #EAF0F6; color: #0B0F14; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 48px; font-weight: 700">6</div><div style="width: 84px; height: 84px; border-radius: 16px; background: #EAF0F6; color: #0B0F14; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 48px; font-weight: 700">6</div><div style="width: 84px; height: 84px; border-radius: 16px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 48px; font-weight: 700">5</div><div style="width: 84px; height: 84px; border-radius: 16px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 48px; font-weight: 700">4</div><div style="width: 84px; height: 84px; border-radius: 16px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 48px; font-weight: 700">2</div><div style="width: 84px; height: 84px; border-radius: 16px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 48px; font-weight: 700">1</div></div>
<div style="text-align: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">Two sixes</div>
<div style="text-align: center; font-size: 24px; color: #A9B8CA">&ldquo;I worked out the odds of that. You would not have liked them.&rdquo;</div>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 22px; color: #A9B8CA">How many</span>
<button type="button" aria-label="One fewer die" style="height: 68px; width: 68px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 30px; font-weight: 600">&minus;</button>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; width: 60px; text-align: center">6</span>
<button type="button" aria-label="One more die" style="height: 68px; width: 68px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 30px; font-weight: 600">+</button>
<div style="display: flex; gap: 8px"><button type="button" style="height: 64px; padding: 0 22px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 12px; font-size: 22px; font-weight: 600">D6</button><button type="button" style="height: 64px; padding: 0 22px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 22px; font-weight: 600">D3</button><button type="button" style="height: 64px; padding: 0 22px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 22px; font-weight: 600">D20</button></div>
<button type="button" style="flex: 1; width: auto; height: 68px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Roll</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
