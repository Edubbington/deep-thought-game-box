<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D&amp;D: character sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">D&amp;D · Brakka</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Fighter 3</div>
<div style="font-size: 22px; font-weight: 600; color: #0B0F14; background: #6CB6FF; padding: 6px 14px; border-radius: 999px">Ethan</div>
</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 8px">
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 22px; color: #A9B8CA">STR</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1">+3</span><span style="font-size: 22px">16</span></div><div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 22px; color: #A9B8CA">DEX</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1">+1</span><span style="font-size: 22px">12</span></div><div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 22px; color: #A9B8CA">CON</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1">+2</span><span style="font-size: 22px">14</span></div><div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 22px; color: #A9B8CA">INT</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1">+0</span><span style="font-size: 22px">10</span></div><div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 22px; color: #A9B8CA">WIS</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1">+1</span><span style="font-size: 22px">12</span></div><div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 22px; color: #A9B8CA">CHA</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1">&minus;1</span><span style="font-size: 22px">8</span></div>
</div>
<div style="display: flex; gap: 8px">
<div style="flex: 3.6; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 22px; color: #A9B8CA">Hit points</span>
<button type="button" aria-label="Lose 1 hit point" style="height: 64px; width: 64px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 30px; font-weight: 600">&minus;</button>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700">28/28</span>
<button type="button" aria-label="Gain 1 hit point" style="height: 64px; width: 64px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 30px; font-weight: 600">+</button>
</div>
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 22px; color: #A9B8CA">AC</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 34px; font-weight: 700; line-height: 1.1">18</span></div><div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 22px; color: #A9B8CA">Prof.</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 34px; font-weight: 700; line-height: 1.1">+2</span></div><div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 22px; color: #A9B8CA">Speed</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 34px; font-weight: 700; line-height: 1.1">25</span></div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Gear</button>
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Spells</button>
<button type="button" style="flex: 1.3; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 22px; font-weight: 600">Level up</button>
<button type="button" style="flex: 1.1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">History</button>
<button type="button" style="flex: 0.9; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Back</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
