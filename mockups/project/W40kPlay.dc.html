<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>40k: main play screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">40k · Battle round 2 of 5</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Shooting phase</div>
<div style="font-size: 22px; font-weight: 600; color: #0B0F14; background: #6CB6FF; padding: 6px 14px; border-radius: 999px">Ethan&#39;s turn</div>
</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 6px"><div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 10px; font-size: 22px; font-weight: 600; background: #151C26; color: #A9B8CA; border: 1px solid #2F3B4D">Command</div><div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 10px; font-size: 22px; font-weight: 600; background: #151C26; color: #A9B8CA; border: 1px solid #2F3B4D">Move</div><div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 10px; font-size: 22px; font-weight: 600; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6">Shoot</div><div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 10px; font-size: 22px; font-weight: 600; background: #151C26; color: #A9B8CA; border: 1px solid #2F3B4D">Charge</div><div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 10px; font-size: 22px; font-weight: 600; background: #151C26; color: #A9B8CA; border: 1px solid #2F3B4D">Fight</div></div>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1">Ethan, pick a unit to shoot with.</div>
<div style="font-size: 24px; color: #A9B8CA">Roll to hit, then to wound. Trevor rolls the saves.</div>
</div>
<div style="display: flex; gap: 14px">
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 22px; color: #A9B8CA">Victory points</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 44px; font-weight: 700"><span style="color: #6CB6FF">18</span><span style="color: #A9B8CA; font-size: 28px; padding: 0 10px">to</span><span style="color: #FFA64D">12</span></span>
</div>
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 22px; color: #A9B8CA">Command points</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 44px; font-weight: 700"><span style="color: #6CB6FF">2</span><span style="color: #A9B8CA; font-size: 28px; padding: 0 10px">to</span><span style="color: #FFA64D">3</span></span>
</div>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1.6; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 22px; font-weight: 600">Next phase</button>
<button type="button" style="flex: 1; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Score</button>
<button type="button" style="flex: 1.5; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Unit lost</button>
<button type="button" style="flex: 0.9; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Undo</button>
<button type="button" style="flex: 1.15; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Lookup</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
