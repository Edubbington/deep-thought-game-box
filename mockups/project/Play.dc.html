<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play: main screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">Kill Team · Round 2 of 4</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Firefight</div>
<div style="font-size: 22px; font-weight: 600; color: #0B0F14; background: #FFA64D; padding: 6px 14px; border-radius: 999px">Trevor&#39;s turn</div>
</div><div style="flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 44px; font-weight: 700; line-height: 1.1">Trevor, pick an operative.</div>
<div style="font-size: 26px; color: #A9B8CA">Choose its order, then spend its actions.</div>
</div>
<div style="display: flex; gap: 14px">
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 22px; color: #A9B8CA">Command points</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 44px; font-weight: 700"><span style="color: #6CB6FF">3</span><span style="color: #A9B8CA; font-size: 28px; padding: 0 10px">to</span><span style="color: #FFA64D">4</span></span>
</div>
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 22px; color: #A9B8CA">Activations left</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 44px; font-weight: 700"><span style="color: #6CB6FF">3</span><span style="color: #A9B8CA; font-size: 28px; padding: 0 10px">to</span><span style="color: #FFA64D">2</span></span>
</div>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1.6; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Next</button>
<button type="button" style="flex: 1; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 24px; font-weight: 600">Score</button>
<button type="button" style="flex: 1.9; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Operative down</button>
<button type="button" style="flex: 1; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 24px; font-weight: 600">Undo</button>
<button type="button" style="flex: 1.1; width: auto; height: 72px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 24px; font-weight: 600">Lookup</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
