<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="font-size: 22px; color: #A9B8CA">40k · Reference</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Wound roll</div>
<div style="width: 10px"></div>
</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 6px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 3px 16px; border-radius: 10px; background: transparent; border: 1px solid transparent"><span style="font-size: 24px">Strength is double the Toughness, or more</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">2+</span></div>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 3px 16px; border-radius: 10px; background: #1D2633; border: 1px solid #2F3B4D"><span style="font-size: 24px">Strength and Toughness are equal</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">4+</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 3px 16px; border-radius: 10px; background: transparent; border: 1px solid transparent"><span style="font-size: 24px">Strength is lower</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">5+</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 3px 16px; border-radius: 10px; background: transparent; border: 1px solid transparent"><span style="font-size: 24px">Strength is half the Toughness, or less</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">6+</span></div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Previous card</button>
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Read aloud</button>
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Next card</button>
<button type="button" style="width: 150px; height: 64px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Close</button>
