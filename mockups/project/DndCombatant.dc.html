<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}

</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">D&amp;D · Round 3</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Wren, Wizard</div>
<div style="width: 10px"></div>
</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 14px">
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 14px; padding: 12px 18px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 22px; color: #A9B8CA">Concentrating on</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">Web</div>
<div style="font-size: 22px">If Wren takes damage: Constitution save, DC 10 or half the damage.</div>
</div>

<div style="font-size: 22px">Standing up costs half her movement.</div>
</div>
</div>
<div style="background: #151C26; border: 1px solid #2F3B4D; border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<span style="font-size: 22px; color: #A9B8CA">Death saves</span>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 22px">Passed</span><div style="display: flex; gap: 10px"><div style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #EAF0F6; background: transparent"></div><div style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #EAF0F6; background: transparent"></div><div style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #EAF0F6; background: transparent"></div></div></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 22px">Failed</span><div style="display: flex; gap: 10px"><div style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #EAF0F6; background: transparent"></div><div style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #EAF0F6; background: transparent"></div><div style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #EAF0F6; background: transparent"></div></div></div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Condition</button>
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Drop spell</button>
<button type="button" style="flex: 1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Damage</button>
<button type="button" style="width: 130px; height: 64px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Back</button>
</div>
</div>
