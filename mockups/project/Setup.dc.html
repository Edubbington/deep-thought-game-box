<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">Kill Team</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Set up</div>
<div style="width: 10px"></div>
</div><div style="flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<button type="button" style="height: 76px; background: #151C26; border: 2px solid #6CB6FF; border-radius: 14px; color: #6CB6FF; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">Ethan</button>
<button type="button" style="height: 76px; background: #151C26; border: 2px solid #FFA64D; border-radius: 14px; color: #FFA64D; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">Trevor</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px"><div style="font-size: 22px; color: #A9B8CA; width: 150px">Mode</div><div style="display: flex; gap: 8px"><button type="button" style="height: 64px; padding: 0 22px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 12px; font-size: 22px; font-weight: 600">Teach</button><button type="button" style="height: 64px; padding: 0 22px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 22px; font-weight: 600">Reminder</button><button type="button" style="height: 64px; padding: 0 22px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 22px; font-weight: 600">Silent</button></div></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px"><div style="font-size: 22px; color: #A9B8CA; width: 150px">Length</div><div style="display: flex; gap: 8px"><button type="button" style="height: 64px; padding: 0 22px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 22px; font-weight: 600">Tutorial: 2 rounds</button><button type="button" style="height: 64px; padding: 0 22px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 12px; font-size: 22px; font-weight: 600">Full: 4 rounds</button></div></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px"><div style="font-size: 22px; color: #A9B8CA; width: 150px">Tac Ops</div><div style="display: flex; gap: 8px"><button type="button" style="height: 64px; padding: 0 22px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 12px; font-size: 22px; font-weight: 600">On</button><button type="button" style="height: 64px; padding: 0 22px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 12px; font-size: 22px; font-weight: 600">Off</button></div></div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 14px">
<button type="button" style="width: 160px; height: 68px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 24px; font-weight: 600">Back</button>
<button type="button" style="flex: 1; width: auto; height: 68px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Start game</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
