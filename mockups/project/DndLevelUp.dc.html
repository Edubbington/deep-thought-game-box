</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; align-items: flex-start; gap: 12px; font-size: 22px; line-height: 1.3; color: #EAF0F6"><div style="width: 26px; height: 26px; margin-top: 1px; border-radius: 6px; border: 2px solid #EAF0F6; background: transparent; flex-shrink: 0"></div><span>New features: read Fighter level 4 in your book</span></div>
</div>
</div>
