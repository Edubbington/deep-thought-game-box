<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teach mode: one step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">Kill Team · Teach</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Shooting, step 2 of 5</div>
<div style="font-size: 22px; font-weight: 600; color: #0B0F14; background: #6CB6FF; padding: 6px 14px; border-radius: 999px">Ethan&#39;s turn</div>
</div><div style="flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700">Roll to hit</div>
<div style="display: flex; gap: 16px; flex: 1">
<div style="flex: 1.25; font-size: 24px; line-height: 1.35; display: flex; flex-direction: column; gap: 10px">
<div>Roll one die for each attack your weapon has.</div>
<div>Each die that equals or beats the weapon&#39;s Hit number is a success.</div>
<div>A six is a critical success. Keep those apart.</div>
</div>
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 22px; color: #A9B8CA">Example: 4 attacks, Hit 3+</div>
<div style="display: flex; gap: 8px">
<div style="width: 52px; height: 52px; border-radius: 10px; background: #EAF0F6; color: #0B0F14; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">6</div><div style="width: 52px; height: 52px; border-radius: 10px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">4</div><div style="width: 52px; height: 52px; border-radius: 10px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">3</div><div style="width: 52px; height: 52px; border-radius: 10px; background: #0B0F14; color: #A9B8CA; border: 1px solid #2F3B4D; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">2</div>
</div>
<div style="font-size: 22px">1 critical, 2 hits, 1 miss</div>
</div>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="width: 140px; height: 68px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 24px; font-weight: 600">Back</button>
<button type="button" style="width: 190px; height: 68px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 24px; font-weight: 600">Say again</button>
<button type="button" style="flex: 1; width: auto; height: 68px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Next</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
