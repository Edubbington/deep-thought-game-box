<helmet>

<style>
body{margin:0}

<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">

<button type="button" style="background: #151C26; border: 1px solid #2F3B4D; border-radius: 16px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; color: #EAF0F6; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 28px; font-weight: 700; color: #FFA64D">Trevor</span><span style="font-size: 22px; color: #A9B8CA">Commander 14/21</span></span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 84px; font-weight: 700; line-height: 1; color: #FFA64D">27</span>

<button type="button" style="background: #1D2633; border: 3px solid #EAF0F6; border-radius: 16px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; color: #EAF0F6; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 28px; font-weight: 700; color: #8FE3A0">Sam</span><span style="font-size: 22px; color: #A9B8CA">Monarch</span></span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 84px; font-weight: 700; line-height: 1; color: #8FE3A0">40</span>
</button>
<button type="button" style="background: #151C26; border: 1px solid #2F3B4D; border-radius: 16px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; color: #EAF0F6; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 28px; font-weight: 700; color: #F29BD4">Jo</span><span style="font-size: 22px; color: #A9B8CA">Poison 3</span></span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 84px; font-weight: 700; line-height: 1; color: #F29BD4">19</span>
