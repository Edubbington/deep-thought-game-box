<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">Play</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Which game?</div>
<div style="width: 10px"></div>
</div><div style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<button type="button" style="height: 140px; box-sizing: border-box; padding: 18px 24px; background: #1D2633; border: 3px solid #EAF0F6; border-radius: 18px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; color: #EAF0F6">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 36px; font-weight: 700">Kill Team</span>
<span style="font-size: 22px; color: #A9B8CA">Two small squads, about an hour</span>
</button>
<button type="button" style="height: 140px; box-sizing: border-box; padding: 18px 24px; background: #151C26; border: 1px solid #2F3B4D; border-radius: 18px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; color: #EAF0F6">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 36px; font-weight: 700">Warhammer 40,000</span>
<span style="font-size: 22px; color: #A9B8CA">Full armies, five battle rounds</span>
</button>
<button type="button" style="height: 140px; box-sizing: border-box; padding: 18px 24px; background: #151C26; border: 1px solid #2F3B4D; border-radius: 18px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; color: #A9B8CA">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 36px; font-weight: 700">D&amp;D</span>
<span style="font-size: 22px; color: #A9B8CA">Not built yet</span>
</button>
<button type="button" style="height: 140px; box-sizing: border-box; padding: 18px 24px; background: #151C26; border: 1px solid #2F3B4D; border-radius: 18px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; color: #A9B8CA">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 36px; font-weight: 700">Magic</span>
<span style="font-size: 22px; color: #A9B8CA">Not built yet</span>
</button>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 14px">
<button type="button" style="width: 160px; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 24px; font-weight: 600">Back</button>
<span style="font-size: 22px; color: #A9B8CA">Press the button to confirm Kill Team</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
