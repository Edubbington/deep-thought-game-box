<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}

<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px">

<div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 600; color: #EAF0F6">Lychguard</span></div>
<span style="font-size: 22px; color: #A9B8CA">Bodyguard</span>
<button type="button" style="height: 48px; padding: 0 16px; border-radius: 10px; font-size: 22px; font-weight: 600; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D">Full</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; height: 64px; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px">

<button type="button" style="height: 48px; padding: 0 16px; border-radius: 10px; font-size: 22px; font-weight: 600; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D">Full</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; height: 64px; background: #151C26; border: 1px solid #2F3B4D; border-radius: 12px">
<div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 600; color: #A9B8CA">Canoptek Doomstalker</span></div>
<span style="font-size: 22px; color: #A9B8CA">Big gun</span>
<button type="button" style="height: 48px; padding: 0 16px; border-radius: 10px; font-size: 22px; font-weight: 600; background: #0B0F14; color: #A9B8CA; border: 1px solid #2F3B4D">Destroyed</button>
</div>
<div style="flex: 1"></div>

<button type="button" style="width: 150px; height: 64px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 24px; font-weight: 600">Back</button>
</div>
</div>
</div>
