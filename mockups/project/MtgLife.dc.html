<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magic: two-player life totals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#6CB6FF}a:hover{color:#9CCEFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #0B0F14; color: #EAF0F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #151C26; border-bottom: 1px solid #2F3B4D">
<div style="font-size: 22px; color: #A9B8CA">Magic · Turn 6</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: #EAF0F6">Declare blockers</div>
<div style="font-size: 22px; font-weight: 600; color: #0B0F14; background: #6CB6FF; padding: 6px 14px; border-radius: 999px">Ethan&#39;s turn</div>
</div><div style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="flex: 1; display: flex; gap: 14px">
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 18px; padding: 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700; color: #6CB6FF">Ethan</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 128px; font-weight: 700; line-height: 1; color: #6CB6FF">20</div>
<div style="font-size: 22px; color: #A9B8CA">No poison</div>
<div style="display: flex; gap: 14px"><button type="button" aria-label="Lose 1 life" style="height: 72px; width: 96px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 36px; font-weight: 600">&minus;</button><button type="button" aria-label="Gain 1 life" style="height: 72px; width: 96px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 36px; font-weight: 600">+</button></div>
</div>
<div style="flex: 1; background: #151C26; border: 1px solid #2F3B4D; border-radius: 18px; padding: 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700; color: #FFA64D">Trevor</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 128px; font-weight: 700; line-height: 1; color: #FFA64D">14</div>
<div style="font-size: 22px; color: #A9B8CA">Poison 2</div>
<div style="display: flex; gap: 14px"><button type="button" aria-label="Lose 1 life" style="height: 72px; width: 96px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 36px; font-weight: 600">&minus;</button><button type="button" aria-label="Gain 1 life" style="height: 72px; width: 96px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 36px; font-weight: 600">+</button></div>
</div>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1.4; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #EAF0F6; color: #0B0F14; border: 1px solid #EAF0F6; border-radius: 14px; font-size: 22px; font-weight: 600">Next step</button>
<button type="button" style="flex: 1.1; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Counters</button>
<button type="button" style="flex: 0.8; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Card</button>
<button type="button" style="flex: 0.8; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Undo</button>
<button type="button" style="flex: 0.8; width: auto; height: 64px; box-sizing: border-box; padding: 0 20px; background: #1D2633; color: #EAF0F6; border: 1px solid #2F3B4D; border-radius: 14px; font-size: 22px; font-weight: 600">Dice</button>
</div>
</div>
</div>
</x-dc>

</html>
